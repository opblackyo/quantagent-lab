[project]
name = "quantagent-lab"
version = "0.1.0"
description = "Reproducible multi-agent quantitative research laboratory"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.162.0",
  "pydantic==2.14.1",
  "pandas==3.1.0",
  "numpy==2.5.4",
  "langgraph==1.2.17",
  "uvicorn==0.54.0",
  "exchange-calendars==4.13.2",
  "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==9.1.1"]
market = ["yfinance==1.7.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"
