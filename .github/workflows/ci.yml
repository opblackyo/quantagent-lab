name: Verify research platform
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: npm --prefix frontend ci
      - run: python tools/audit_public.py --approved-name opblackyo --approved-noreply 68807943+opblackyo@users.noreply.github.com
      - run: node --test tools/dev_options.test.mjs
      - run: uv run pytest
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run build
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: node tools/run_research_fixture_e2e.mjs
        env:
          QUANTAGENT_PYTHON: ${{ github.workspace }}/.venv/bin/python
      - run: uv run python tools/run_live_operator.py e2e-test
